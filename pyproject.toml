[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dirsize"
version = "0.1.0"
description = "Find what is eating your disk: the biggest files and folders under a path, human readable."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Boyan253/dirsize"

[project.scripts]
dirsize = "dirsize:main"

[tool.setuptools]
py-modules = ["dirsize"]
